name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache Menagerie assets
        uses: actions/cache@v4
        with:
          path: third_party/mujoco_menagerie
          key: menagerie-${{ hashFiles('scripts/fetch_assets.sh') }}

      - name: Fetch robot models
        run: bash scripts/fetch_assets.sh

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check pnp tests scripts

      - name: Unit + integration tests
        run: pytest -q --durations=5

      - name: Smoke benchmark (10 episodes)
        run: python -m pnp.eval.run_eval --n 10 --configs nominal --out ci_results

      - uses: actions/upload-artifact@v4
        with:
          name: ci-results-py${{ matrix.python-version }}
          path: ci_results/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pnp:ci .
      - name: Run tests in container
        run: docker run --rm pnp:ci pytest -q
